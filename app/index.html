<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Viz-Man</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transition: transform 4s linear; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #gl { display: none; }
  #message {
    display: none; position: fixed; left: 0; right: 0; top: 46%;
    text-align: center; color: #555; font: 3vh sans-serif; transition: transform 4s linear;
  }
  #hint {
    position: fixed; right: 3vw; bottom: 4vh; padding: 1vh 1.2vw;
    background: rgba(0, 0, 0, 0.7); color: #bbb; font: 2.2vh sans-serif;
    opacity: 0; transition: opacity 0.4s;
  }
  #toast {
    position: fixed; left: 0; right: 0; top: 5vh; text-align: center;
    color: #ccc; font: 2.6vh sans-serif; text-shadow: 0 0 1vh #000;
    opacity: 0; transition: opacity 0.6s;
  }
  #menu {
    display: none; position: fixed; left: 22vw; top: 20vh; width: 56vw;
    padding: 2vh 0; background: rgba(0, 0, 0, 0.85); border: 1px solid #333;
    color: #ddd; font: 2.6vh sans-serif;
  }
  #menu .row { display: flex; justify-content: space-between; padding: 1.2vh 2vw; }
  #menu .row.focus { background: #2a5; color: #000; }
  #debug {
    display: none; position: fixed; left: 2vw; top: 3vh; max-width: 90vw;
    padding: 1vh 1vw; background: rgba(0, 0, 0, 0.7); color: #8f8;
    font: 1.8vh monospace; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas"></canvas><canvas id="gl"></canvas></div>
<div id="message"></div>
<div id="hint">OK: menu</div>
<div id="toast"></div>
<div id="menu"></div>
<div id="debug"></div>
<script src="./config.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
